# Nginx site for morainmahj: React build at /, Express API at /api/*.
#
# Install on EC2 as:
#   sudo cp deploy/nginx/morainmahj.conf /etc/nginx/sites-available/morainmahj
#   sudo ln -s /etc/nginx/sites-available/morainmahj /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# This is the pre-SSL version and is served over plain HTTP on purpose so that
# certbot can complete its HTTP-01 challenge. Running
# `sudo certbot --nginx -d morainmahj.com -d www.morainmahj.com` rewrites this
# file in place: it adds the listen 443 block with the certificate paths and a
# redirect from HTTP. Do not hand-write the TLS block before certbot runs, or the
# challenge will fail against a certificate that does not exist yet.

upstream morainmahj_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with the real domain. Until DNS points here, `_` also matches the
    # bare EC2 public IP so you can smoke-test before the domain cuts over.
    server_name morainmahj.com www.morainmahj.com _;

    # The React build output (vite build -> dist/), uploaded to this path.
    root /var/www/morainmahj-frontend;
    index index.html;

    access_log /var/log/nginx/morainmahj-access.log;
    error_log  /var/log/nginx/morainmahj-error.log;

    # Matches the express.json limit in server.js so a large bulk import fails
    # in the app with a JSON error rather than as an Nginx 413 HTML page.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API ---------------------------------------------------------------
    # No URI part on proxy_pass, so the /api prefix is forwarded unchanged and
    # the Express routes keep matching (/api/auth, /api/entities, ...).
    location /api/ {
        proxy_pass http://morainmahj_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Some ported functions do real work (bulk email, league generation);
        # the default 60s read timeout cuts them off mid-flight.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # --- Frontend ----------------------------------------------------------
    # Vite emits hashed filenames under /assets, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, otherwise a deploy leaves browsers
    # requesting asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Capacitor deep links and the service worker need to resolve from the root.
    location = /manifest.json {
        add_header Cache-Control "no-store";
    }

    # React Router owns client-side routing, so unknown paths fall back to the
    # SPA shell instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
